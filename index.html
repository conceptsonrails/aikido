<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aikido Visualization - Kyu Selector</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 8px;
      background-color: #f8f9fa;
      color: #333;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
    h1 {
      font-size: 1.4em;
      margin-top: 5px;
      margin-bottom: 15px;
      text-align: center;
    }
    .config {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.8em; font-weight: bold; color: #555; }
    button, select, input {
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
    }
    button { background-color: #2b3a4a; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    button:hover { background-color: #1d2631; }
    button.btn-auto { background-color: #27ae60; }
    button.btn-auto.activo { background-color: #e74c3c; }

    #tecnica-display { text-align: center; margin: 15px 0; min-height: 60px; }
    .tecnica-texto { font-size: 1.3em; font-weight: bold; color: #1a252f; line-height: 1.2; }
    .contador { font-size: 0.85em; color: #7f8c8d; margin-top: 6px; }

    .controles { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; }

    /* Contenedor del reproductor de vídeo */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      margin-top: 10px;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .btn-fallback {
      display: block;
      width: 100%;
      background-color: #e74c3c;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    @media (min-width: 600px) {
      body { margin: 20px; }
      .card { padding: 25px; }
      h1 { font-size: 1.8em; }
      .tecnica-texto { font-size: 1.6em; }
      .config { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🥋 Aikido - Kyu Visualization</h1>

    <div class="config">
      <div class="field">
        <label for="programa">Syllabus:</label>
        <select id="programa">
          <option value="todos">All Syllabuses</option>
          <option value="2007">2007 Syllabus</option>
          <option value="2019">2019 Syllabus (Current)</option>
        </select>
      </div>

      <div class="field">
        <label for="kyu">Kyu Grade:</label>
        <select id="kyu">
          <option value="todos">All Grades</option>
          <option value="6">6th Kyu</option>
          <option value="5">5th Kyu</option>
          <option value="4">4th Kyu</option>
          <option value="3">3rd Kyu</option>
          <option value="2">2nd Kyu</option>
          <option value="1">1st Kyu</option>
        </select>
      </div>

      <div class="field">
        <label for="modo">Mode:</label>
        <select id="modo">
          <option value="orden">Sequential Order</option>
          <option value="random">Random Order</option>
        </select>
      </div>

      <div class="field">
        <label for="voz">Voice (Spanish / Finnish):</label>
        <select id="voz">
          <option value="">Loading voices...</option>
        </select>
      </div>

      <div class="field">
        <label for="velocidad">Speed (<span id="valVelocidad">0.75</span>x):</label>
        <input type="range" id="velocidad" min="0.5" max="1.1" step="0.05" value="0.75">
      </div>

      <div class="field">
        <label for="pausa">Auto Pause (<span id="valPausa">5</span>s):</label>
        <input type="range" id="pausa" min="2" max="15" step="1" value="5">
      </div>
    </div>

    <div id="tecnica-display">
      <div class="tecnica-texto" id="tecnica">Select filters and press a button</div>
      <div class="contador" id="progreso">Remaining in this block: -</div>
    </div>

    <div class="controles">
      <button id="btnAuto" class="btn-auto" style="flex: 2;">▶ Start Auto Mode</button>
      <button id="siguiente" style="flex: 1;">Next</button>
      <button id="repetir" style="flex: 1;">Repeat</button>
    </div>

    <!-- Área de vídeo dinámico -->
    <div id="videoArea"></div>
  </div>

      const synth = window.speechSynthesis;

      function aplicarFiltros() {
        const prog = document.getElementById("programa")?.value || "todos";
        const kyuSel = document.getElementById("kyu")?.value || "todos";

        let lista = baseDeDatosTecnicas.filter(t => {
          const cumplePrograma = (prog === "todos" || t.programa === prog);
          const cumpleKyu = (kyuSel === "todos" || t.kyu.toString() === kyuSel);
          return cumplePrograma && cumpleKyu;
        });

        if (prog === "todos") {
          const visto = new Set();
          lista = lista.filter(t => {
            if (visto.has(t.nombre)) return false;
            visto.add(t.nombre);
            return true;
          });
        }

        tecnicasFiltradas = lista;
        index = -1;
        tecnicasPendientesRandom = [...tecnicasFiltradas];

        const tec = document.getElementById("tecnica");
        if (tec) tec.innerText = tecnicasFiltradas.length > 0 ? "Filter applied. Ready." : "No techniques found for this filter.";

        actualizarProgreso(tecnicasFiltradas.length);
        if (esModoAuto) detenerAuto();

        renderizarVideo(null);
      }

      function cargarVoces() {
        if (!synth) return;

        vocesDisponibles = synth.getVoices() || [];
        const selectVoz = document.getElementById("voz");
        if (!selectVoz) return;

        if (vocesDisponibles.length === 0) {
          selectVoz.innerHTML = '<option value="">Default system voice</option>';
          return;
        }

        let vocesFiltradas = vocesDisponibles.filter(v =>
          v.lang && (v.lang.toLowerCase().startsWith('es') || v.lang.toLowerCase().startsWith('fi'))
        );

        if (vocesFiltradas.length === 0) {
          vocesFiltradas = vocesDisponibles;
        }

        const valorPrevio = selectVoz.value;
        selectVoz.innerHTML = "";

        vocesFiltradas.forEach(voz => {
          const option = document.createElement("option");
          option.value = voz.name;
          option.textContent = `${voz.name} (${voz.lang})`;
          selectVoz.appendChild(option);
        });

        if (valorPrevio && vocesFiltradas.some(v => v.name === valorPrevio)) {
          selectVoz.value = valorPrevio;
        }
      }

      function hablar(texto, alTerminar) {
        if (!synth) {
          if (alTerminar) alTerminar();
          return;
        }

        try {
          synth.resume();
          synth.cancel();
        } catch (e) {}

        const utterance = new SpeechSynthesisUtterance(texto);
        const selectVoz = document.getElementById("voz");
        const elemVelocidad = document.getElementById("velocidad");
        const velocidad = elemVelocidad ? parseFloat(elemVelocidad.value) : 0.75;

        utterance.rate = velocidad;

        if (selectVoz && selectVoz.value && vocesDisponibles.length > 0) {
          const vozSeleccionada = vocesDisponibles.find(v => v.name === selectVoz.value);
          if (vozSeleccionada) {
            utterance.voice = vozSeleccionada;
            utterance.lang = vozSeleccionada.lang;
          }
        }

        let finalizado = false;
        const ejecutarFinal = () => {
          if (!finalizado) {
            finalizado = true;
            if (alTerminar) alTerminar();
          }
        };

        utterance.onend = ejecutarFinal;
        utterance.onerror = ejecutarFinal;

        const tiempoEstimado = (texto.length * 120 / velocidad) + 1500;
        setTimeout(ejecutarFinal, tiempoEstimado);

        synth.speak(utterance);
      }

      function actualizarProgreso(restantes) {
        const el = document.getElementById("progreso");
        if (el) el.innerText = `Remaining in this block: ${restantes} of ${tecnicasFiltradas.length}`;
      }

      function renderizarVideo(tecnica) {
        const videoArea = document.getElementById("videoArea");
        if (!videoArea) return;

        if (tecnica && tecnica.youtubeId && tecnica.youtubeId.trim() !== "") {
          const videoUrl = `https://www.youtube.com/watch?v=${tecnica.youtubeId}`;
          videoArea.innerHTML = `
            <div class="video-container">
              <iframe
                src="https://www.youtube.com/embed/${tecnica.youtubeId}?autoplay=0&rel=0"
                title="${tecnica.nombre}"
                allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
              </iframe>
            </div>
            <p style="text-align: center; font-size: 0.85em; margin-top: 5px;">
              <a href="${videoUrl}" target="_blank" style="color: #e74c3c; font-weight: bold;">Open in YouTube ↗</a>
            </p>
          `;
        } else if (tecnica && tecnica.nombre) {
          const query = encodeURIComponent(`Aikido ${tecnica.nombre}`);
          videoArea.innerHTML = `
            <button class="btn-fallback" onclick="window.open('https://www.youtube.com/results?search_query=${query}', '_blank')">
              🔍 Search "${tecnica.nombre}" in YouTube (Sin ID asignado)
            </button>
          `;
        } else {
          videoArea.innerHTML = "";
        }
      }

      function obtenerSiguienteTecnica() {
        if (tecnicasFiltradas.length === 0) return null;

        const modoEl = document.getElementById("modo");
        const modo = modoEl ? modoEl.value : "orden";

        if (modo === "orden") {
          index++;
          if (index >= tecnicasFiltradas.length) index = 0;
          actualizarProgreso(tecnicasFiltradas.length - index);
          return tecnicasFiltradas[index];
        } else {
          if (tecnicasPendientesRandom.length === 0) {
            tecnicasPendientesRandom = [...tecnicasFiltradas];
          }
          const randomIndex = Math.floor(Math.random() * tecnicasPendientesRandom.length);
          const seleccionada = tecnicasPendientesRandom.splice(randomIndex, 1)[0];
          actualizarProgreso(tecnicasPendientesRandom.length);
          return seleccionada;
        }
      }

      function programarSiguienteAutomatico() {
        if (!esModoAuto) return;
        const pausaEl = document.getElementById("pausa");
        const segundosPausa = (pausaEl ? parseInt(pausaEl.value, 10) : 5) * 1000;
        autoTimer = setTimeout(() => {
          if (esModoAuto) mostrarSiguiente();
        }, segundosPausa);
      }

      function mostrarSiguiente() {
        clearTimeout(autoTimer);
        objetoTecnicaActual = obtenerSiguienteTecnica();

        const el = document.getElementById("tecnica");
        if (objetoTecnicaActual) {
          if (el) el.innerText = objetoTecnicaActual.nombre;

          renderizarVideo(objetoTecnicaActual);

          hablar(objetoTecnicaActual.nombre, () => {
            if (esModoAuto) programarSiguienteAutomatico();
          });
        } else {
          if (el) el.innerText = "No techniques available";
          renderizarVideo(null);
        }
      }

      function detenerAuto() {
        esModoAuto = false;
        clearTimeout(autoTimer);
        if (synth) synth.cancel();
        const btn = document.getElementById("btnAuto");
        if (btn) {
          btn.innerText = "▶ Start Auto Mode";
          btn.classList.remove("activo");
        }
      }

      function toggleAuto() {
        if (synth) synth.resume();
        const btn = document.getElementById("btnAuto");
        if (esModoAuto) {
          detenerAuto();
        } else {
          esModoAuto = true;
          if (btn) {
            btn.innerText = "⏹ Stop Auto Mode";
            btn.classList.add("activo");
          }
          mostrarSiguiente();
        }
      }

      if (synth) {
        synth.onvoiceschanged = cargarVoces;
      }

      document.getElementById("velocidad")?.addEventListener("input", (e) => {
        const val = document.getElementById("valVelocidad");
        if (val) val.innerText = e.target.value;
      });

      document.getElementById("pausa")?.addEventListener("input", (e) => {
        const val = document.getElementById("valPausa");
        if (val) val.innerText = e.target.value;
      });

      document.getElementById("modo")?.addEventListener("change", () => {
        index = -1;
        tecnicasPendientesRandom = [...tecnicasFiltradas];
        actualizarProgreso(tecnicasFiltradas.length);
        if (esModoAuto) detenerAuto();
      });

      document.getElementById("programa")?.addEventListener("change", aplicarFiltros);
      document.getElementById("kyu")?.addEventListener("change", aplicarFiltros);

      document.getElementById("btnAuto")?.addEventListener("click", toggleAuto);

      document.getElementById("siguiente")?.addEventListener("click", () => {
        if (synth) synth.resume();
        if (esModoAuto) detenerAuto();
        mostrarSiguiente();
      });

      document.getElementById("repetir")?.addEventListener("click", () => {
        if (synth) synth.resume();
        if (objetoTecnicaActual) hablar(objetoTecnicaActual.nombre);
      });

      cargarVoces();
      setTimeout(cargarVoces, 300);
      document.addEventListener('touchstart', cargarVoces, { once: true });
      document.addEventListener('click', cargarVoces, { once: true });

      aplicarFiltros();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", inicializarApp);
    } else {
      inicializarApp();
    }
  </script>
</body>
</html>
